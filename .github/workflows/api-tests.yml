name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST every day
  workflow_dispatch:
    inputs:
      suiteFile:
        description: "TestNG suite"
        type: choice
        options: [src/test/resources/testng.xml, src/test/resources/smoke.xml]
        default: src/test/resources/testng.xml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: mvn -B clean test -DsuiteFile=${{ github.event.inputs.suiteFile || 'src/test/resources/testng.xml' }}

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Save report as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
